# secpt · config.yaml
# pydantic-settings 加载顺序：环境变量（以 SECPT_ 前缀，嵌套用 __）> 本文件 > 模型默认值
# 真实敏感字段（API key 等）只放在环境变量里，不要提交进仓库。

app:
  name: secpt
  version: "0.1.0"
  workdir: ./data/runs

llm:
  provider: deepseek
  planning_model: deepseek-chat
  eval_model: deepseek-v1-flash        # 不限制模型，按场景换 deepseek-chat / deepseek-reasoner
  api_key_env: DEEPSEEK_API_KEY    # 这里写环境变量名，不是 key 本身；key 通过 export DEEPSEEK_API_KEY=... 注入
  temperature: 0.2
  max_tokens: 2048
  timeout_s: 60.0
  fake: false                       # true → 用 FakeLLM（测试 / dry-run）

graph:
  backend: memory                   # memory / sqlite / postgres（postgres 未实现）
  sqlite:
    path: ./data/graphstore.sqlite
    echo: false
  postgres:
    dsn: ""
    pool_size: 5

react:
  max_steps: 12
  timeout_s: 600
  early_stop_on_finish: true
  reflection: false

tools:
  command_whitelist:
    - nmap
    - curl
    - dig
    - whois
  tool_names:
    - read_file
    - nmap
    - curl
    - dig
    - whatweb
    - whois
    - crawler
    - http_analyze
    - saml
    - flag_extract
  exec_timeout_s: 120
  sandbox:
    enabled: false
    backend: null

logging:
  level: INFO
  json: false
  file: null

audit:
  enabled: true
  path: ./data/audit

pricing:
  input_per_1k: 0.002      # CNY / 1K input tokens（deepseek-chat 缓存未命中）
  output_per_1k: 0.008     # CNY / 1K output tokens
