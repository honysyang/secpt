<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>secpt 智能助理</title>
<style>
:root{
  --brand:#4e6ef2; --brand-hover:#3b5bdb; --brand-light:#eef2ff;
  --bg:#ffffff; --sidebar-bg:#f7f8fa; --card:#f5f7fd;
  --text:#1f2329; --text-2:#646a73; --border:#e5e6eb;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);display:flex;overflow:hidden}

/* ============ 侧边栏 ============ */
.sidebar{width:264px;min-width:264px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4e6ef2,#7b5cf0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.logo-name{font-size:16px;font-weight:600}
.btn-new{margin:8px 16px 16px;padding:10px 0;border:none;border-radius:10px;background:var(--brand-light);color:var(--brand);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn-new:hover{background:#dfe6ff}
.session-list{flex:1;overflow-y:auto;padding:0 12px}
.session-item{padding:10px 12px;border-radius:10px;font-size:13.5px;color:var(--text-2);cursor:pointer;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s;display:flex;justify-content:space-between;align-items:center}
.session-item:hover{background:#eceef3}
.session-item.active{background:#e8ecf8;color:var(--text);font-weight:500}
.session-del{opacity:0;color:#a0a3ad;font-size:15px;padding:0 2px}
.session-item:hover .session-del{opacity:1}
.session-del:hover{color:#f55}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--text-2)}

/* ============ 主区 ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.mode-bar{display:flex;justify-content:center;gap:6px;padding:12px 0;border-bottom:1px solid var(--border);background:#fff}
.mode-pill{padding:6px 18px;border-radius:999px;font-size:13px;color:var(--text-2);cursor:pointer;border:none;background:transparent;transition:.15s}
.mode-pill.active{background:var(--brand);color:#fff;font-weight:500}
.mode-pill:not(.active):hover{background:var(--brand-light);color:var(--brand)}

.chat-scroll{flex:1;overflow-y:auto;padding:24px 0 12px}
.chat-inner{max-width:820px;margin:0 auto;padding:0 24px}

/* 空状态 */
.welcome{text-align:center;padding-top:12vh}
.welcome h1{font-size:26px;font-weight:600;background:linear-gradient(90deg,#4e6ef2,#7b5cf0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:var(--text-2);margin:12px 0 34px;font-size:14px}
.hint-cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hint-card{width:220px;text-align:left;padding:14px 16px;border:1px solid var(--border);border-radius:12px;font-size:13px;color:var(--text-2);cursor:pointer;transition:.15s;line-height:1.5}
.hint-card:hover{border-color:var(--brand);color:var(--brand);box-shadow:0 4px 14px rgba(78,110,242,.10)}

/* 消息 */
.msg{display:flex;margin-bottom:22px;gap:12px}
.msg.user{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.avatar.ai{background:linear-gradient(135deg,#4e6ef2,#7b5cf0)}
.avatar.user{background:#0f9d58}
.bubble{max-width:76%;line-height:1.75;font-size:14.5px}
.msg.user .bubble{background:var(--brand);color:#fff;padding:11px 16px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;word-break:break-word}
.msg.ai .bubble{width:calc(100% - 46px);max-width:100%;background:var(--card);padding:14px 18px;border-radius:4px 16px 16px 16px}
.bubble pre{background:#0d1117;color:#e6edf3;padding:12px 14px;border-radius:10px;overflow-x:auto;margin:8px 0;font-size:13px;line-height:1.6}
.bubble code{font-family:ui-monospace,Consolas,monospace}
.bubble :not(pre)>code{background:rgba(78,110,242,.10);color:var(--brand);padding:1px 6px;border-radius:5px;font-size:13px}
.bubble h3{margin:10px 0 6px;font-size:15px}
.bubble ul{padding-left:20px;margin:6px 0}
.bubble li{margin:3px 0}
.cursor{display:inline-block;width:2px;height:15px;background:var(--brand);animation:blink .8s infinite;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}

.status-line{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:12.5px;margin:0 0 16px 46px}
.status-line .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* 输入区 */
.input-area{padding:10px 24px 20px;background:linear-gradient(transparent,var(--bg) 30%)}
.input-box{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:22px;padding:12px 14px 10px;box-shadow:0 4px 20px rgba(0,0,0,.05);transition:.15s}
.input-box:focus-within{border-color:var(--brand);box-shadow:0 4px 24px rgba(78,110,242,.15)}
.input-row{display:flex;align-items:flex-end;gap:10px}
textarea{flex:1;border:none;outline:none;resize:none;font-size:14.5px;line-height:1.6;max-height:160px;font-family:inherit;background:transparent}
.btn-send{width:34px;height:34px;border-radius:50%;border:none;background:var(--brand);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.btn-send:hover{background:var(--brand-hover)}
.btn-send:disabled{background:#c9cdd4;cursor:not-allowed}
.input-tip{text-align:right;font-size:11px;color:#a0a3ad;margin-top:6px}

/* 审批弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:99}
.mask.show{display:flex}
.dialog{width:420px;background:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.dialog h3{font-size:16px;margin-bottom:6px}
.dialog .warn{color:#e6a23c;font-size:13px;margin-bottom:12px}
.dialog .args{background:var(--card);border-radius:10px;padding:10px 12px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;max-height:140px;overflow:auto;word-break:break-all;margin-bottom:16px;line-height:1.6}
.dialog-btns{display:flex;gap:10px;justify-content:flex-end}
.dialog-btns button{padding:8px 22px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:13.5px;cursor:pointer}
.dialog-btns .approve{background:var(--brand);border-color:var(--brand);color:#fff}
.dialog-btns .approve:hover{background:var(--brand-hover)}

/* ===== 配置中心 ===== */
.mask.cfg{align-items:center;justify-content:center}
.cfg-panel{background:#fff;border-radius:14px;width:min(860px,92vw);height:min(640px,86vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.18)}
.cfg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #eef0f4}
.cfg-head h3{margin:0;font-size:16px}
.cfg-close{border:none;background:none;font-size:22px;cursor:pointer;color:#888;line-height:1}
.cfg-tabs{display:flex;gap:6px;padding:10px 18px 0}
.cfg-tab{border:none;background:#f2f4f9;color:#555;padding:7px 18px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px}
.cfg-tab.active{background:var(--brand);color:#fff}
.cfg-body{flex:1;overflow:auto;padding:16px 18px}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cfg-card{border:1px solid #e8ebf2;border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s}
.cfg-card:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(78,110,242,.10)}
.cfg-card b{font-size:14px}
.cfg-card p{margin:6px 0 0;font-size:12px;color:#777;line-height:1.5;max-height:36px;overflow:hidden}
.cfg-badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;margin-left:8px;vertical-align:1px}
.badge-builtin{background:#eef2ff;color:#4e6ef2}
.badge-custom{background:#e6f7ef;color:#0aa06e}
.badge-override{background:#fff4e5;color:#d97a00}
.badge-danger{background:#ffecec;color:#e5484d}
.cfg-form label{display:block;font-size:12px;color:#666;margin:12px 0 4px}
.cfg-form input[type=text],.cfg-form input[type=number],.cfg-form textarea{width:100%;box-sizing:border-box;border:1px solid #dfe3ec;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
.cfg-form textarea{min-height:90px;resize:vertical}
.cfg-tools{display:flex;flex-wrap:wrap;gap:8px}
.cfg-tools label{display:flex;align-items:center;gap:4px;font-size:12px;color:#444;border:1px solid #e2e6f0;border-radius:14px;padding:4px 10px;cursor:pointer;margin:0}
.cfg-tools input{accent-color:var(--brand)}
.cfg-btns{display:flex;gap:10px;margin-top:16px}
.cfg-btns button{border:none;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;background:#f2f4f9;color:#444}
.cfg-btns .primary{background:var(--brand);color:#fff}
.cfg-btns .danger{background:#fff0f0;color:#e5484d}
.cfg-empty{text-align:center;color:#999;font-size:13px;padding:60px 0}
.cfg-hint{font-size:12px;color:#999;margin:10px 0 0}

@media (max-width:768px){.sidebar{display:none}}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo"><div class="logo-mark">S</div><div class="logo-name">secpt 智能助理</div></div>
  <button class="btn-new" onclick="newSession()">＋ 新建对话</button>
  <div class="session-list" id="sessionList"></div>
  <button class="btn-new" style="margin-top:8px" onclick="openConfig()">⚙ 配置中心</button>
  <div class="sidebar-footer">Harness · 单/多智能体 · 工具审批</div>
</aside>

<main class="main">
  <div class="mode-bar">
    <button class="mode-pill active" data-mode="single">单智能体</button>
    <button class="mode-pill" data-mode="team">多智能体</button>
    <button class="mode-pill" data-mode="swarm">集群</button>
  </div>

  <div class="chat-scroll" id="scroll">
    <div class="chat-inner" id="chat">
      <div class="welcome" id="welcome">
        <h1>secpt 智能助理</h1>
        <p>通用智能体 Harness：工具调用 · 多智能体协作 · 事件驱动集群</p>
        <div class="hint-cards">
          <div class="hint-card" onclick="quick(this)">扫描 https://example.com 的安全配置，评估响应头与 TLS</div>
          <div class="hint-card" onclick="quick(this)">用单智能体模式分析这个任务：设计一个短链服务</div>
          <div class="hint-card" onclick="quick(this)">切换到集群模式，调研并对比 Redis 与 Memcached</div>
        </div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="给 secpt 智能助理发送消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="btn-send" id="sendBtn" onclick="send()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="input-tip">内容由 AI 生成，请注意甄别 · 危险操作需人工确认</div>
    </div>
  </div>
</main>

<!-- HITL 审批弹窗 -->
<div class="mask" id="mask">
  <div class="dialog">
    <h3>⚠ 危险工具请求执行</h3>
    <div class="warn">该操作可能修改文件或执行命令，请确认后再批准。</div>
    <div style="font-size:13px;color:var(--brand);font-weight:600;margin-bottom:6px" id="dlgTool"></div>
    <div class="args" id="dlgArgs"></div>
    <div class="dialog-btns">
      <button onclick="decide(false)">拒绝</button>
      <button class="approve" onclick="decide(true)">批准执行</button>
    </div>
  </div>
</div>

<!-- 配置中心 -->
<div class="mask cfg" id="cfg">
  <div class="cfg-panel">
    <div class="cfg-head">
      <h3>⚙ 配置中心</h3>
      <button class="cfg-close" onclick="closeConfig()">×</button>
    </div>
    <div class="cfg-tabs">
      <button class="cfg-tab active" data-tab="roles" onclick="cfgTab('roles')">角色</button>
      <button class="cfg-tab" data-tab="tools" onclick="cfgTab('tools')">工具</button>
      <button class="cfg-tab" data-tab="skills" onclick="cfgTab('skills')">技能</button>
    </div>
    <div class="cfg-body" id="cfgBody"></div>
  </div>
</div>

<script>
/* ================= 会话管理 ================= */
// localStorage 在隐私模式/沙箱环境下访问会抛 SecurityError，
// 用探测包装降级为内存存储，保证脚本不中断、页面交互始终可用
const store = (() => {
  try { localStorage.setItem('__probe', '1'); localStorage.removeItem('__probe'); return localStorage; }
  catch { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }
})();
let mode = 'single';
// JSON.parse 防御：localStorage 中损坏/被篡改的数据不应炸掉整个脚本
let sessions = [];
try {
  const raw = JSON.parse(store.getItem('secpt_sessions') || '[]');
  if (Array.isArray(raw)) sessions = raw;
} catch { sessions = []; }
let curId = store.getItem('secpt_cur') || null;
let pendingApproval = null;
let busy = false;

function persist(){ store.setItem('secpt_sessions', JSON.stringify(sessions)); store.setItem('secpt_cur', curId || ''); }
function renderSessions(){
  const box = document.getElementById('sessionList');
  box.innerHTML = '';
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.id === curId ? ' active' : '');
    div.innerHTML = `<span>${escAttr(s.name)}</span><span class="session-del" title="删除">×</span>`;
    div.onclick = e => {
      if (e.target.classList.contains('session-del')) {
        sessions = sessions.filter(x => x.id !== s.id);
        if (curId === s.id) { curId = sessions[0]?.id || null; }
        persist(); renderSessions(); return;
      }
      curId = s.id; persist(); renderSessions();
    };
    box.appendChild(div);
  });
}
// 捕获欢迎页模板：新建对话时清空聊天区并恢复它
const welcomeTpl = document.getElementById('welcome')?.outerHTML || '';
function newSession(){
  const s = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name: '新对话'};
  sessions.unshift(s); curId = s.id; persist(); renderSessions();
  document.getElementById('chat').innerHTML = welcomeTpl;  // 主区回到欢迎页
}
if (!curId || !sessions.find(s => s.id === curId)) newSession(); else renderSessions();

/* ================= 渲染 ================= */
const chat = document.getElementById('chat');
const scroll = document.getElementById('scroll');

function mdRender(text){
  // 手写 mini markdown：代码块 > 行内代码 > 粗体 > 标题 > 列表 > 换行
  let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const blocks = [];
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push(`<pre><code>${code.replace(/\n$/,'')}</code></pre>`);
    return `\u0000${blocks.length-1}\u0000`;
  });
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>')
             .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
             .replace(/^### (.+)$/gm, '<h3>$1</h3>')
             .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
             .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>')
             .replace(/\n/g, '<br>');
  html = html.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
  return html;
}

function addMsg(role, text){
  document.getElementById('welcome')?.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="avatar ${role==='ai'?'ai':'user'}">${role==='ai'?'S':'我'}</div><div class="bubble"></div>`;
  chat.appendChild(div);
  setBubble(div, text);
  scrollDown();
  return div.querySelector('.bubble');
}
function setBubble(msgDiv, text){
  const bubble = msgDiv.querySelector('.bubble');
  if (role(msgDiv) === 'user') { bubble.textContent = text; return; }
  bubble.innerHTML = mdRender(text);
}
function role(div){ return div.classList.contains('ai') ? 'ai' : 'user'; }
function scrollDown(){ scroll.scrollTop = scroll.scrollHeight; }

function addStatus(text){
  document.getElementById('welcome')?.remove();
  const div = document.createElement('div');
  div.className = 'status-line';
  div.innerHTML = `<span class="dot"></span><span></span>`;
  div.lastChild.textContent = text;
  chat.appendChild(div); scrollDown();
  return div;
}
function addStreamBubble(){
  const bubble = addMsg('ai', '');
  bubble.innerHTML += '<span class="cursor"></span>';
  return bubble;
}
function streamAppend(bubble, chunk){
  // addMsg 返回的已是 .bubble 元素本身，直接在其上累积渲染
  bubble.dataset.raw = (bubble.dataset.raw || '') + chunk;
  bubble.innerHTML = mdRender(bubble.dataset.raw) + '<span class="cursor"></span>';
  scrollDown();
}
function streamFinish(bubble, finalText){
  bubble.innerHTML = mdRender(finalText ?? (bubble.dataset.raw || ''));
}

/* ================= API 封装 ================= */
// HTML 属性上下文转义：value 回填 / onclick 参数中的数据可能含引号与尖括号，
// 不转义会破坏 DOM 结构甚至注入脚本（角色 instructions 来自用户输入）
function escAttr(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// 统一 API 入口：自动携带 X-Api-Key；401 时引导输入密钥并重试一次。
// 服务端配置 WEB_API_KEY 后所有 /api 接口强制校验，此前裸 fetch 会整体失败
async function apiFetch(url, opts = {}){
  const headers = Object.assign({'X-Api-Key': store.getItem('secpt_api_key') || ''}, opts.headers || {});
  let resp = await fetch(url, {...opts, headers});
  if (resp.status === 401) {
    const key = prompt('接口需要认证，请输入 API Key（对应服务端 .env 的 WEB_API_KEY）：');
    if (key === null) throw new Error('未授权：未提供 API Key');
    store.setItem('secpt_api_key', key);
    resp = await fetch(url, {...opts, headers: {...headers, 'X-Api-Key': key}});
    if (resp.status === 401) throw new Error('未授权：API Key 不正确');
  }
  return resp;
}

/* ================= 审批弹窗 ================= */
window.showApproval = d => {
  pendingApproval = d;
  document.getElementById('dlgTool').textContent = '工具: ' + d.tool;
  document.getElementById('dlgArgs').textContent = d.args;
  document.getElementById('mask').classList.add('show');
};
window.decide = async approved => {
  document.getElementById('mask').classList.remove('show');
  if (!pendingApproval) return;
  await apiFetch(`/api/approval/${pendingApproval.approval_id}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({approved})
  });
  pendingApproval = null;
};

/* ================= 发送与 SSE 解析 ================= */
window.quick = el => { document.getElementById('input').value = el.textContent.trim(); send(); };

async function send(){
  if (busy) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  busy = true; document.getElementById('sendBtn').disabled = true;

  // 会话名 = 首条消息
  let s = sessions.find(x => x.id === curId);
  if (!s) { newSession(); s = sessions[0]; }
  if (s.name === '新对话') { s.name = text.slice(0, 20); persist(); renderSessions(); }

  addMsg('user', text);
  const streamBubble = addStreamBubble();

  try {
    const resp = await apiFetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: curId, message: text, mode})
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
        handleEvent(ev, streamBubble);
      }
    }
  } catch (e) {
    addStatus('连接错误: ' + e.message);
  } finally {
    streamFinish(streamBubble);
    busy = false; document.getElementById('sendBtn').disabled = false;
  }
}

function handleEvent(ev, streamBubble){
  switch (ev.type) {
    case 'token':
      // swarm 多 Worker：agent 变化时在气泡内插文本分隔线，避免产出混排难读
      if (ev.agent && streamBubble.dataset.agent !== ev.agent) {
        streamBubble.dataset.agent = ev.agent;
        if (streamBubble.dataset.raw) {
          streamAppend(streamBubble, '\n\n—— ' + ev.agent + ' ——\n\n');
        }
      }
      streamAppend(streamBubble, ev.content);
      break;
    case 'status': addStatus(ev.content); break;
    case 'approval_request': window.showApproval(ev); break;
    case 'error': addStatus('错误: ' + ev.message); break;
    case 'done': /* 汇总由 token 事件承载 */ break;
  }
}

/* ================= 输入框 ================= */
const input = document.getElementById('input');
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

/* ================= 模式切换 ================= */
document.querySelectorAll('.mode-pill').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
  };
});

/* ================= 配置中心 ================= */
let cfgCache = { roles: [], tools: [] };
const SOURCE_LABEL = { builtin: '内置', custom: '自定义', override: '覆盖内置' };

window.openConfig = () => { document.getElementById('cfg').classList.add('show'); cfgTab('roles'); };
window.closeConfig = () => document.getElementById('cfg').classList.remove('show');

window.cfgTab = async tab => {
  document.querySelectorAll('.cfg-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const body = document.getElementById('cfgBody');
  body.innerHTML = '<div class="cfg-empty">加载中…</div>';
  try {
    if (tab === 'roles') {
      cfgCache.roles = await (await apiFetch('/api/config/roles')).json();
      renderRoles();
    } else if (tab === 'tools') {
      cfgCache.tools = await (await apiFetch('/api/config/tools')).json();
      renderTools();
    } else {
      renderSkills();
    }
  } catch (e) { body.innerHTML = '<div class="cfg-empty">加载失败: ' + e.message + '</div>'; }
};

function renderRoles(){
  const cards = cfgCache.roles.map(r =>
    '<div class="cfg-card" onclick="editRole(\'' + escAttr(r.name) + '\')">' +
    '<b>' + escAttr(r.name) + '</b><span class="cfg-badge badge-' + r.source + '">' + (SOURCE_LABEL[r.source] || r.source) + '</span>' +
    '<p>' + escAttr(r.description || r.instructions.slice(0, 50)) + ' · 工具 ' + r.tools.length + ' 个</p></div>'
  ).join('');
  document.getElementById('cfgBody').innerHTML =
    '<div class="cfg-btns" style="margin:0 0 14px"><button class="primary" onclick="editRole(\'\')">＋ 新建角色</button>' +
    '<span class="cfg-hint">点击角色卡片编辑；保存后热重载，下一次对话立即生效</span></div>' +
    '<div class="cfg-grid">' + cards + '</div>';
}

window.editRole = name => {
  const r = cfgCache.roles.find(x => x.name === name) ||
    { name: '', description: '', instructions: '', tools: [], max_steps: 10 };
  const isEdit = !!name;
  const toolChecks = cfgCache.tools.map(t =>
    '<label><input type="checkbox" value="' + escAttr(t.name) + '"' + (r.tools.includes(t.name) ? ' checked' : '') + '>' +
    escAttr(t.name) + (t.dangerous ? ' ⚠' : '') + '</label>'
  ).join('');
  document.getElementById('cfgBody').innerHTML =
    '<div class="cfg-form">' +
    '<label>角色名（唯一标识，保存后不可改）</label>' +
    '<input type="text" id="cfgName" value="' + escAttr(r.name) + '"' + (isEdit ? ' readonly style="background:#f5f6fa"' : '') + ' placeholder="如 code_reviewer">' +
    '<label>一句话描述</label>' +
    '<input type="text" id="cfgDesc" value="' + escAttr(r.description) + '" placeholder="供人阅读与 LLM 路由参考">' +
    '<label>系统提示词 instructions（必填）</label>' +
    '<textarea id="cfgInstr">' + escAttr(r.instructions) + '</textarea>' +
    '<label>允许的工具（最小权限，不勾选 = 纯文本角色）</label>' +
    '<div class="cfg-tools">' + toolChecks + '</div>' +
    '<label>ReAct 最大步数</label>' +
    '<input type="number" id="cfgSteps" value="' + escAttr(r.max_steps) + '" min="1" max="50">' +
    '<div class="cfg-btns">' +
    '<button class="primary" onclick="saveRole()">保存并热重载</button>' +
    '<button onclick="cfgTab(\'roles\')">取消</button>' +
    (isEdit && r.source !== 'builtin' ? '<button class="danger" onclick="deleteRole(\'' + escAttr(r.name) + '\')">删除</button>' : '') +
    '</div></div>';
};

window.saveRole = async () => {
  const name = document.getElementById('cfgName').value.trim();
  const payload = {
    description: document.getElementById('cfgDesc').value.trim(),
    instructions: document.getElementById('cfgInstr').value,
    tools: [...document.querySelectorAll('#cfgBody .cfg-tools input:checked')].map(i => i.value),
    max_steps: parseInt(document.getElementById('cfgSteps').value, 10) || 10,
  };
  if (!name) { alert('角色名不能为空'); return; }
  if (!payload.instructions.trim()) { alert('instructions 必填'); return; }
  const resp = await apiFetch('/api/config/roles/' + encodeURIComponent(name), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
  });
  const data = await resp.json();
  if (!resp.ok) { alert('保存失败: ' + (data.error || resp.status)); return; }
  cfgTab('roles');
};

window.deleteRole = async name => {
  if (!confirm('确认删除角色 ' + name + '？若为内置角色的覆盖配置，将移除覆盖并恢复默认。')) return;
  const resp = await apiFetch('/api/config/roles/' + encodeURIComponent(name), { method: 'DELETE' });
  const data = await resp.json();
  if (!resp.ok) { alert('删除失败: ' + (data.error || resp.status)); return; }
  cfgTab('roles');
};

function renderTools(){
  const cards = cfgCache.tools.map(t =>
    '<div class="cfg-card" style="cursor:default"><b>' + escAttr(t.name) + '</b>' +
    (t.dangerous ? '<span class="cfg-badge badge-danger">危险</span>' : '') +
    '<p>' + escAttr(t.description) + '</p></div>'
  ).join('');
  document.getElementById('cfgBody').innerHTML =
    '<div class="cfg-hint" style="margin:0 0 12px">共 ' + cfgCache.tools.length +
    ' 个工具（内置注册 + tools/ 目录自定义脚本），只读展示；角色通过「角色」页勾选授权。</div>' +
    '<div class="cfg-grid">' + cards + '</div>';
}

function renderSkills(){
  document.getElementById('cfgBody').innerHTML =
    '<div class="cfg-empty">暂无已注册技能</div>' +
    '<div class="cfg-hint" style="text-align:center">harness.skills 已提供 PromptSkill / ToolSkill / SkillRegistry 体系，业务链路接入技能注册后将在此展示。</div>';
}
</script>
</body>
</html>
