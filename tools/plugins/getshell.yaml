# getshell 插件：多阶段渗透的拿 shell 能力（需求3示例）
# 用法：profile 的 tools/stages.tools 里声明 getshell 即装配。
# 需要系统真实安装命令（默认 getshell，可用 {bin} 参数或复制本文件改名定制）。
name: getshell
description: >
  对目标执行 getshell 尝试（外部智能体/工具封装）。返回其 JSON/文本输出，
  通常包含 shell 是否成功、会话信息与下一步建议。多阶段渗透第二阶段使用。
schema:
  type: object
  properties:
    target:
      type: string
      description: 目标 host:port 或 URL（题面入口）
    entry:
      type: string
      description: 可选：具体入口路径/服务（如 /saml/login）
  required: [target]
# 命令模板：{参数} 经 shlex.quote 后替换，argv 数组执行（禁 shell=True）
# 把下面命令换成你环境里真实的 getshell 工具/智能体 CLI 即可：
run: "getshell --target {target} --json"
timeout_s: 300
