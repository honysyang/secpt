# pwn 插件模板：二进制防御面检查（pwn 场景第一步）
# 装配：profile:pwn 的 tools 里声明 pwn_checksec（显式引用才装配，admin enable 语义）。
# 依赖系统安装 checksec（pwn 沙箱镜像已预装；宿主缺工具时插件会返回安装提示）。
# 深度分析用 analyze_binary（Python 插件，sections/symbols/strings/gadgets 聚合）。
name: pwn_checksec
description: >
  检查二进制防御机制（NX/ Canary / PIE / RELRO / FORTIFY），pwn 场景的前置画像步骤。
  只读操作，返回 checksec 的文本输出。
schema:
  type: object
  properties:
    binary:
      type: string
      description: 二进制文件路径（相对 work_dir 或绝对路径）
  required: [binary]
# 命令模板：{参数} 经 shlex.quote 后替换，argv 数组执行（禁 shell=True）
run: "checksec --file={binary}"
timeout_s: 60
