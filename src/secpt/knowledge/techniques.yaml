# 通用打法参考库（按技术信号匹配，注入意图 objective；只作线索，需自行验证）。
# 设计：indicators 用无歧义的小写片段（中英混排），命中 ≥1 才注入；最多注入 2 条。
# 不是执行器、不含目标信息；新增条目只改数据，不改代码。
- name: SSRF / 带外验证
  indicators: [ssrf, "url=", "url 参数", webhook, image_url, fetch_url, 抓取, 内网, 169.254.169.254, metadata, gopher]
  summary: 服务端发起请求的参数优先验证回连；OOB 监听器证明请求真实发出，再升级为内网探测。
  steps:
    - 用 oob 工具起监听，把 url_base 作为参数值投递，check 确认来源 IP
    - 常见的协议/编码绕过：gopher、file、dict、@、#、%00、双 URL 编码
    - 内网目标优先 169.254.169.254、127.0.0.1、容器网段与题面给出的地址

- name: SSTI / 模板注入
  indicators: [ssti, template, 模板, jinja, twig, freemarker, velocity, "{{", "render"]
  summary: 先确认模板引擎与沙箱，再用无害算术探测；沙箱逃逸优先找框架已知 gadget。
  steps:
    - "{{7*7}} / {{7*'7'}} / ${7*7} / #{7*7} 区分引擎"
    - 能执行表达式后再读文件/命令；注意 WAF 对花括号与关键字的过滤
    - 失败时换分隔符/编码/大小写，或找模板继承/内置对象链

- name: 反序列化
  indicators: [deserialize, 反序列化, unserialize, ysoserial, phpggc, gadget, pickle, java serial, viewstate]
  summary: 先确认协议头与可控点，再按语言选 gadget 链；优先无回显 OOB 验证。
  steps:
    - 识别 magic bytes/结构（AC ED、O:、rO0、gAS、__VIEWSTATE）
    - 用最小 payload 验证反序列化是否发生（DNS/HTTP 回连）
    - 失败先查版本与依赖库（不是所有链都适用）

- name: SQL 注入 / WAF 绕过
  indicators: [sqli, sql injection, sql 注入, 注入点, waf, union select, sleep, 布尔盲注]
  summary: 先建立布尔/时间基线，再绕 WAF；优先参数化之外的二次注入点。
  steps:
    - 布尔/时间盲注建立真假基线，避免只靠报错
    - WAF 绕过：内联注释、大小写、HPP、分块传输、编码、替换关键字
    - 二次注入（注册/导入/日志）常绕过前置过滤

- name: LFI / 路径穿越
  indicators: [lfi, 路径穿越, traversal, "../../", file=, include, download, 任意文件读取]
  summary: 先确认读文件原语，再找日志/临时文件/上传实现 RCE；编码与包装器是主要绕过面。
  steps:
    - 编码：..%2f、..%252f、%c0%ae、反斜杠、绝对路径
    - PHP 包装器：php://filter、data://、zip://；Node 原型链/符号链接
    - 读 /proc/self/environ、日志、session、上传临时文件做包含

- name: JWT / 会话伪造
  indicators: [jwt, json web token, bearer, kid, jku, alg none, 会话, cookie 伪造]
  summary: 先解构 header/payload，再逐项验证签名与信任链缺陷。
  steps:
    - alg=none / 算法混淆（RS256→HS256，用公钥当 HMAC 密钥）
    - kid 路径穿越/命令注入、jku/x5u 指向可控 JWKS
    - 弱密钥爆破（hashcat jwt 模式），或找服务端不校验 claim 的越权面

- name: SAML / SSO
  indicators: [saml, sso, idp, nameid, assertion, signature, xsw, 单点登录]
  summary: 审计签名覆盖范围与断言解析差异；XSW 与签名剥离是高频路径。
  steps:
    - 检查签名是否覆盖整个 Assertion（含 ID/时间/属性）
    - XML Signature Wrapping：插入伪造断言，保留原签名
    - 尝试剥离签名/改 NameID/Role 属性，观察是否被接受

- name: 文件上传 / 解析绕过
  indicators: [upload, 上传, multipart, content-type, filename, webshell, 图片马]
  summary: 先确认落盘位置与可访问性，再绕内容/扩展/解析校验。
  steps:
    - MIME/Content-Type 伪造、双扩展、大小写、尾部点/空格、%00
    - 魔数伪造（图片马）、压缩包/解压路径穿越
    - 竞争上传（校验与落盘时序）、.htaccess/.user.ini 覆盖解析

- name: 命令注入 / 盲 RCE
  indicators: [command injection, 命令注入, ping, exec, system(, 盲 rce, oob]
  summary: 先确认回显/盲通道，再处理过滤与分隔符；OOB 是最可靠的盲验证。
  steps:
    - 分隔符：; && || | 换行 $() 反引号，空格用 ${IFS}/制表符
    - 盲打用 oob 或 DNS 回连；注意命令长度与字符集限制
    - 被过滤时尝试编码、变量拼接、base64 解码执行

- name: 二进制 / 固件分析
  indicators: [二进制, 固件, 逆向, reverse, elf, mcu, bytecode, 字节码, vm, 加密, crypto]
  summary: 先静态定位校验/解密逻辑，再动态验证输入输出；VM 题先把指令集还原。
  steps:
    - strings/binwalk/file/readelf 先看结构；找校验常量与 XOR 表
    - 还原校验函数（符号执行/z3 可选）；VM 题先写反汇编器再模拟
    - 动态跑正确路径，确认输出与预期（密钥流/内存 dump）后再重建 flag

- name: 权限提升 / 横向
  indicators: [提权, privilege, sudo, suid, credential, 凭据, 横向, lateral, 内网]
  summary: 先枚举本机可复用凭据与配置，再用最小权限验证假设。
  steps:
    - 找配置文件/环境变量/历史命令里的凭据；同一凭据试其他主机/服务
    - SUID/sudo/cron/服务权限；容器内看挂载与 socket
    - 每获得一个访问权立即记录（access:/credential:），供后续意图复用

- name: 前端 / JS 沙箱逃逸
  indicators: [javascript, node, vm2, sandbox, 沙箱, prototype, 原型链, xss, dom]
  summary: 先确认执行上下文与版本，再用原型链/构造函数链突破；注意无回显时用 OOB。
  steps:
    - 收集版本与可用全局对象，测试 this.constructor.constructor("return process")()
    - vm2/isolated-vm 历史 CVE 优先；原型链污染打宿主
    - 无回显时用 oob 回调或写文件到可访问路径
