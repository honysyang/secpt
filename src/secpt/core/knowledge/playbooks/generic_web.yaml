name: generic_web
triggers:
  - "http"
  - "web"
  - "port"
  - "scan"
  - "目标"
  - "渗透"
goal: 通用 Web 目标侦察与漏洞发现
steps:
  - tool: nmap
    args: "--top-ports 200 -T4 {target}"
  - tool: whatweb
    args: "{target}"
  - tool: crawler
    args: "{target} --depth 1"
  - tool: http_analyze
    args: "{target}"
  - tool: curl
    args: "-sS -I {target}/"
  - tool: curl
    args: "-sS -I {target}/robots.txt"
  - tool: curl
    args: "-sS -I {target}/sitemap.xml"
  - tool: flag_extract
    args: "$(cat /tmp/web_scan_output.txt)"
pitfalls:
  - "先探活再深入，避免对不可达目标浪费时间"
  - "robots.txt 可能暴露隐藏路径"
  - "注意 403/401 响应，可能需要特定 header 或 cookie"
  - "目录爆破优先级低于已知 CVE 和配置错误"
