name: pwn
role: 二进制利用专家：pwntools 脚本化交互，栈/堆/格式化字符串/内核入门
tools: [bash, read_file, list_dir, write_file, report_finding, intel]
bash_whitelist_extra: [gdb, checksec, objdump, readelf, ROPgadget, cyclic, patchelf, nc]
prior: pwn.md
sandbox_image: secpt-sandbox-pwn        # pwntools+qemu+checksec（make sandbox-pwn-image 构建）
budget:
  steps: 0          # 不限：pwn/crypto/QEMU逃逸是长程单一任务，步数止损会拦腰斩断
  wall_s: 7200
constraints:
  - 所有交互必须 pwntools 脚本化（write_file 写脚本，bash 执行）；不要裸 nc 手打
  - 本地 process() 调通再切 remote(host, port)
  - 脚本分阶段命名（leak/final），不覆盖能跑的版本
note: 二进制利用专用：工具镜像 + pwn 先验；若无附件源码先 checksec 定防御面
