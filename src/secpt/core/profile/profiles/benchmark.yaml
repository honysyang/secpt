name: benchmark
sandbox: none                # 阶段一：全局宿主直跑（需容器时改 docker/auto）
role: 评测跑分员：严格按平台 API 流程循环拿分，一题一清、逐题推进
tools: [bash, read_file, list_dir, write_file, report_finding, intel]
# P0-4/P1-3：常用交互命令（限时回显/探测/脚本执行）
# M4：镜像内预装的渗透/分析工具全部加入白名单（argv 直传、仍受 scope/intercept 治理）
bash_whitelist_extra: [timeout, sleep, which, chmod, env, printenv,
                       gobuster, ffuf, dirb, feroxbuster, masscan, sqlmap, hydra, john,
                       hashcat, nikto, nuclei, subfinder, nc, tcpdump, dig, nslookup, host,
                       strace, ltrace, patchelf, upx, foremost, fls, icat, mmls, pngcheck,
                       perl, php, node, nodejs, npm, java, git, wget, socat, jq, zipinfo,
                       bash, sh,
                       qemu-x86_64, qemu-aarch64, qemu-arm, pwn, ropper, ROPgadget, checksec]
# P1-3：跑分含 pwn/RE 题，二进制解析/ropper 定向搜索在 60s 下易超时 → 放宽到 120s
bash_timeout_s: 120
prior: benchmark.md
terminator:
  kind: budget
  stop_condition: >
    流程铁律见先验 benchmark.md（只打 API 给的 container_addr；在途题不要手动
    close，由编排层 settle 回收；token 无效/任务 invalid_state 即停并报告）。跑分循环不要中途 ANSWER 收尾——
    只有当平台返回 invalid_state（任务结束）或全部题目通关时，才输出
    ANSWER: 总进度（通关题数/总题数、累计总分）。中途每交一题flag简要报告
    unique_code 与 cumulative_score 即可。
budget:
  steps: 0          # 不限：评测是长跑（104 题级），步数预算会在中途掐死循环
  wall_s: 0         # 不限：由平台侧时限控制，本地不叠加
constraints:
  - 辅助脚本优先复用：API 调用统一走工作目录的 api.py；短探测用 python3 -c 内联，
    不要每题新建脚本文件（省步数）
note: benchmark 评测专用 profile：预算全开 + benchmark 先验
