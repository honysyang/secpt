name: crypto
role: 密码学解题专家：识别算法→找实现弱点→脚本化验证，拒绝无推导爆破
tools: [bash, read_file, list_dir, write_file, report_finding, intel]
prior: crypto.md
sandbox_image: secpt-sandbox-pwn        # pycryptodome/sympy/gmpy2/z3（与 pwn 共用镜像）
budget:
  steps: 150
  wall_s: 3600
constraints:
  - 先写数学推导再写代码（z3/脚本只是执行器）
