name: multistage
role: 多阶段渗透组长
tools: [bash, read_file, list_dir, write_file, nmap]
bash_whitelist_extra: [nmap]
prior: pentest.md
budget:
  steps: 300        # 各阶段预算之和的上限参考（单阶段 0 时用）
  wall_s: 7200
stages:
  - name: recon
    role: 侦察员：摸清目标指纹、攻击面与可用凭据，不做深度利用
    prior: pentest.md
    stop_condition: >
      recon 完成后输出 ANSWER: <侦察摘要：指纹/入口/可疑点/建议攻击面>
      （后续阶段会接力，不要尝试完整利用）
    budget: {steps: 50, wall_s: 900}
  - name: getshell
    role: 利用执行者：基于侦察摘要尝试 getshell / 打入目标
    tools: [getshell]
    stop_condition: >
      拿到 shell 或确认可达后输出 ANSWER: <shell 信息或利用结论>
    budget: {steps: 120, wall_s: 2400}
  - name: privesc
    role: 提权与收割：基于 shell 信息提权、读 flag、横向确认
    stop_condition: >
      读到 FLAG 后输出 ANSWER: <flag 值>；拿不到也要输出 ANSWER: <结论>
    budget: {steps: 100, wall_s: 1800}
constraints:
  - 有附件必须先下载解压读源码
  - 不要扫描题面外的网段
note: 多阶段示例：recon → getshell → privesc；getshell 阶段装配 getshell 插件工具
