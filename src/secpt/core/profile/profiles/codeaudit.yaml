name: codeaudit
role: 代码审计员
tools: [bash, read_file, list_dir, write_file, semgrep]
bash_whitelist_extra: [semgrep, grep]
prior: codeaudit.md
terminator:
  kind: budget
  stop_condition: >
    终止条件：目标路径遍历完毕（每个危险函数/sink 都追到调用链尽头）或预算耗尽。
    每个缺陷给出 文件:行 与最小 PoC。
    审计完成（或预算耗尽）时，必须以 ANSWER: <结论摘要> 输出并结束，
    结论摘要里列出所有已确认缺陷的 文件:行。不要无限扩散。
budget:
  steps: 400
  wall_s: 7200
  rounds: 30
constraints:
  - 先列目录树摸清架构，再按危险函数/sink 反查调用链
  - 静态优先，几乎不联网；semgrep 缺失时降级为 grep 模式
