name: ctf
role: CTF 解题手
tools: [bash, read_file, list_dir, write_file, nmap]
bash_whitelist_extra: [nmap]
prior: ctf.md
terminator:
  kind: budget
  stop_condition: >
    找到 FLAG（样式不固定）后，以 ANSWER: <flag 值> 输出结论并结束；
    未找到也要以 ANSWER: <你的分析结论> 收尾，不要无限扩散测试面。
budget:
  steps: 100
  wall_s: 900
constraints:
  - 有附件必须先下载解压读源码
  - 不要扫描题面外的网段
note: 有附件必须先下载解压读源码
