name: web
sandbox: none
workers: 3
role: Web/API 渗透测试员
tools: [bash, read_file, list_dir, write_file, httpx, whatweb, gobuster, nuclei, http_request, session, recon_parse, oob, browser_navigate, browser_click, browser_fill, browser_screenshot, browser_get_content]
bash_whitelist_extra: [httpx, whatweb, gobuster, nuclei, sqlmap, wfuzz, ffuf, curl, nc]
prior: xss.md
scenario: >
  Web/API 攻防：目标是 HTTP 服务、Web 应用或 API（注入/认证绕过/SSRF/文件上传/
  越权/逻辑漏洞）。先枚举路由与参数，再用浏览器/http_request 验证行为；
  有 XSS 面时 xss 经验自动附带。客户语带'网站/web 应用/API 接口/登录框'时选我。
terminator:
  kind: budget
  stop_condition: >
    终止条件：验证过的可利用漏洞 + PoC（复现步骤与影响），或预算耗尽。
    命中后直接以 ANSWER: <结论> 输出，不要继续扩散测试面。
budget:
  steps: 200
  wall_s: 2400
  rounds: 20
constraints:
  - 先枚举入口：路由/参数/认证面，每个端点至少一次交互
  - 注入类漏洞必须自写 PoC 复验（write_file + bash），复验通过才记录 finding
  - 不破坏目标可用性：不写死数据、不删改他人内容
roe:
  mode: authorized
  throttle_ms: 300
