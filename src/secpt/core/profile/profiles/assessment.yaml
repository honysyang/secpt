name: assessment
sandbox: none                # 阶段一：全局宿主直跑（需容器时改 docker/auto）
role: 安全评估员
tools: [bash, read_file, list_dir, write_file, nmap, browser_navigate, browser_click, browser_fill, browser_screenshot, browser_get_content, web_search]
bash_whitelist_extra: [nmap]
prior: assessment.md
terminator:
  kind: budget
  stop_condition: >
    终止条件：检查清单跑完（逐项给出 通过/不通过 + 依据）或预算耗尽。
    审计完成（或预算耗尽）时，必须以 ANSWER: <结论摘要> 输出并结束，
    结论摘要里列出所有已确认缺陷的 文件:行。不要无限扩散。
budget:
  steps: 300
  wall_s: 28800
  rounds: 30
constraints:
  - 以检查清单驱动，逐项验证，禁止破坏性动作
  - 发现即记录风险等级（高/中/低）+ 依据
scenario: >
  授权范围内的资产盘点/配置核查/风险评级：以枚举和基线检查为主，验证到'可证明'即止，不做破坏性利用与驻留。客户语常带'评估/体检/合规/资产清单'。
