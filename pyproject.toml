[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secpt"
version = "0.1.0"
description = "渗透测试智能体 harness：LLM 负责聪明，骨架负责不犯低级错误"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
secpt = "secpt.main:main"

[tool.hatch.build.targets.wheel]
packages = ["secpt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
