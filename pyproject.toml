[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "secpt"
version = "0.1.0"
description = "secpt — security penetration testing agent (Python 3.12, self-hosted ReAct on top of litellm/DeepSeek)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "secpt" }]
keywords = ["security", "pentest", "react", "agent", "litellm", "deepseek"]

dependencies = [
    # LLM / Agent
    "litellm>=1.50.0",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    # Logging
    "structlog>=24.1",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # Async / IO
    "httpx>=0.27",
    "anyio>=4.4",
    # Storage (Phase 0 默认 SQLite，可平滑切 Postgres)
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    # Utility
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "freezegun>=1.5",
    "respx>=0.21",
    "pre-commit>=3.7",
]

[project.scripts]
secpt = "secpt.cli.app:app"

# ───────────────────────── Hatch 构建目标 ─────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/secpt"]

# ───────────────────────── 测试 ─────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 涉及真实网络/数据库的慢用例",
    "slow: 慢用例",
]

# ───────────────────────── Lint / Type ─────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/secpt"]

# ───────────────────────── Coverage ─────────────────────────
[tool.coverage.run]
branch = true
source = ["src/secpt"]

[tool.coverage.report]
show_missing = true
skip_covered = true
