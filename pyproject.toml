[project]
name = "agent-harness"
version = "0.1.0"
description = "通用 AI 智能体运行框架（Agent Harness）"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "openai-agents>=0.1",
    "pydantic>=2.0",
    "structlog>=24.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "pgvector>=0.3",
    "sqlite-vec>=0.1",
    "numpy>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
harness-cli = "app.cli.main:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "runtime", "adapters", "plugins", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
