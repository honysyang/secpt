# 裁判 profile（蓝本 §3.7）：M2 示例靶场配置。
# target 只是记账口径（进场三问的 target 仍以 goal 文本为准）；
# [judge].enabled=false 或整段缺省 = 裁判关闭；[[ground_truth]] 是 R4 正典，
# pattern 不分大小写子串匹配 findings 的 title+detail，多命中取首条。
target = '10.0.0.5'

[judge]
enabled = true

[[ground_truth]]
id = "GT-22-open"
pattern = "22/tcp open"

# 规划重估（M5 双图事件线）：graph_changed 每 review_every_steps 步置一次旗，
# 主循环在步界调 LLMC 重估规划；review_limit = 每 run 名额上限（防烧钱）。
# LLMC 只提案不裁决，提案经下一步注意力包吸收才生效。缺段=取默认 5/3。
[plan]
review_every_steps = 5
review_limit = 3

# 出场验收（M5 清单③"交付对目标"）：每条 acceptance 必须被一条 verified finding
# 的 title/detail 子串命中（不分大小写），否则 done 过不了出场三验、弹回继续走。
# 未配置 = 不判（探索型任务/mock 演示本来没有硬性交付物）。示例：
# [[acceptance]]
# id = "AC-flag"
# pattern = "flag{"
# description = "拿到靶场 flag"

# 关键参数（设计文档 L66）：步数线（主 LLM 循环预算）与失速阈值。
[budget]
max_steps = 200
workers = 3        # 任务板 worker 线程数（SECPT_WORKERS 可临时覆盖）

[stall]
failures = 5        # 连续工具失败 N 步 → 拉铃（救场或 E_STALL）
repeat_plans = 2    # 连续 N 步提出同一段规划 → 拉铃（重复抑制）
repeat_calls = 4    # 同一 (工具, 参数) 调用累计 N 次 → 拉铃（M5-31：同 URL 反复抓/同文件反复读的空转在此撞线）
