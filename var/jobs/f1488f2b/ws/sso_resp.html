    <style>
        :root {
            --primary: #1677ff;
            --primary-light: #4096ff;
            --gray-7: #8c8c8c;
            --gray-10: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e6f4ff 0%, #ffffff 100%);
            margin: 0;
        }

        .loading-card {
            background: white;
            border: 1px solid #f0f0f0;
            border-radius: 16px;
            padding: 48px 64px;
            box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 480px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #f0f0f0;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--gray-10);
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: 600;
        }

        p {
            color: var(--gray-7);
            line-height: 1.6;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            margin-top: 24px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 2px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>
