name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest：暴露平台差异（文件名禁字形、os.getuid、路径分隔符等）
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]" ruff

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Tests（FakeLLM 无 key 全链路）
        # shell: bash：统一 PYTHONPATH=src 语法（Windows 默认 pwsh 不兼容 VAR=x cmd）
        shell: bash
        run: PYTHONPATH=src pytest tests/ -q
        env:
          SECPT_FAKE_LLM: "1"
